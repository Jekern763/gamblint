name: Deploy CDK

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infrastructure/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./infrastructure
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@a20cf827fed7baafaae4bd5a5b13c4e01ec52d16
        with:
          role-to-assume: ${{ secrets.AWSROLE }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      - name: Deploy
        working-directory: ./infrastructure
        run: pnpm cdk deploy --require-approval never
